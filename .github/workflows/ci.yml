name: Testes e build
on:
  push:
    branches: [main, work]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: carbons_test
          POSTGRES_USER: carbons
          POSTGRES_PASSWORD: ci-only-not-production
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carbons -d carbons_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://carbons:ci-only-not-production@localhost:5432/carbons_test
      TEST_DATABASE_URL: postgresql+psycopg://carbons:ci-only-not-production@localhost:5432/carbons_test
      APP_ENV: test
      DEMO_MODE: "true"
      TOKEN_SECRET: ci-ephemeral-test-only-secret-not-for-production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock
      - run: ruff check app tests && ruff format --check app tests
        working-directory: backend
      - run: pytest --tb=short
        working-directory: backend
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx prettier --check app components lib next.config.ts playwright.config.ts e2e
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m app.e2e
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: frontend/test-results/
          retention-days: 7
